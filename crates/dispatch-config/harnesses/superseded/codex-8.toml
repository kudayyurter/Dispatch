id = "codex"
icon = ""
display_name = "Codex"
command = "codex"
args = []

[platform.windows]
command = "cmd.exe"
args = ["/c", "codex"]

[task]
args = ["exec", "{task}"]

# See claude.toml: the task reaches codex on standard input, never on
# cmd.exe's command line. `-` tells `codex exec` to read it from there.
[task.platform.windows]
args = ["/d", "/v:off", "/c", "codex", "exec", "-", "<%DISPATCH_TASK_FILE%"]
input = "file"

# See claude.toml for how settings become flags.
[[settings]]
key = "model"
label = "Model"
kind = "choice"
options = [
  { value = "gpt-6-astra", label = "GPT-6 Astra" },
  { value = "gpt-6-sol", label = "GPT-6 Sol" },
  { value = "gpt-6-luna", label = "GPT-6 Luna" },
  { value = "gpt-5.6-sol", label = "GPT-5.6 Sol" },
  { value = "gpt-5.6-terra", label = "GPT-5.6 Terra" },
  { value = "gpt-5.6-luna", label = "GPT-5.6 Luna" },
  { value = "gpt-5.5", label = "GPT-5.5" },
]
custom = true
args = ["-m", "{value}"]

# -c parses its value as TOML and falls back to the raw string, so the level
# needs no quotes, which would sit on cmd.exe's command line on Windows.
[[settings]]
key = "effort"
label = "Effort"
kind = "choice"
options = [
  { value = "low", label = "Low" },
  { value = "medium", label = "Medium" },
  { value = "high", label = "High" },
  { value = "xhigh", label = "Extra high" },
  { value = "max", label = "Max" },
  { value = "ultra", label = "Ultra" },
]
args = ["-c", "model_reasoning_effort={value}"]

# Codex's only way to skip every prompt also drops its sandbox.
[[settings]]
key = "bypass"
label = "Skip prompts"
kind = "bool"
default = true
args = ["--dangerously-bypass-approvals-and-sandbox"]

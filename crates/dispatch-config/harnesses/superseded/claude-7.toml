id = "claude"
icon = ""
display_name = "Claude Code"
command = "claude"
args = []

# `claude` installs on Windows as a claude.cmd shim, which CreateProcess
# cannot execute directly.
[platform.windows]
command = "cmd.exe"
args = ["/c", "claude"]

[task]
args = ["-p", "{task}"]

# cmd.exe reads its whole command line as shell syntax, so a task placed
# there could run its & and %VAR% as commands, and could not hold a newline.
# Dispatch writes the task to a file instead, names it in DISPATCH_TASK_FILE
# (already quoted for cmd.exe), and cmd.exe redirects it into `claude -p`,
# which reads its prompt from standard input. /d skips AutoRun commands;
# /v:off keeps ! literal.
[task.platform.windows]
args = ["/d", "/v:off", "/c", "claude", "-p", "<%DISPATCH_TASK_FILE%"]
input = "file"

# Each setting's args go after the launch's own, in a one-shot run too, with
# {value} replaced by what was chosen. Unset passes nothing and leaves the
# choice to Claude. `e` on a harness in the new-pane picker changes them.
[[settings]]
key = "model"
label = "Model"
kind = "choice"
options = ["opus", "sonnet", "fable", "haiku"]
custom = true
args = ["--model", "{value}"]

[[settings]]
key = "effort"
label = "Effort"
kind = "choice"
options = ["low", "medium", "high", "xhigh", "max"]
args = ["--effort", "{value}"]

[[settings]]
key = "permissions"
label = "Permissions"
kind = "choice"
options = ["bypassPermissions", "auto", "acceptEdits", "plan", "manual"]
default = "bypassPermissions"
args = ["--permission-mode", "{value}"]
